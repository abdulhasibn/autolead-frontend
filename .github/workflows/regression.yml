name: Regression

# Production gate: runs on every PR into main (the dev -> main release PR and
# hotfixes). Unit tests plus the Playwright E2E suite against a throwaway local
# Supabase and the backend API. Never touches a hosted or production database.
#
# Secrets needed (names only):
#   BACKEND_REPO_TOKEN  read access to abdulhasibn/autoLeadBackend (the repo may
#                       be private; the default GITHUB_TOKEN cannot read it).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend ref to test against
        default: dev
        required: false

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_REPO: abdulhasibn/autoLeadBackend
  BACKEND_REF: ${{ inputs.backend_ref || 'dev' }}

jobs:
  unit:
    name: Unit
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E (shard ${{ matrix.shard }}/2)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: 'true'
      # Frontend (src/lib/env.ts). Throwaway values; the backend is local.
      AUTH_SECRET: ci-only-auth-secret-0123456789abcdef0123456789
      AUTH_URL: http://localhost:3001
      AUTH_TRUST_HOST: 'true'
      API_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v5

      - name: Checkout backend
        uses: actions/checkout@v5
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ env.BACKEND_REF }}
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start local Supabase (applies migrations)
        working-directory: backend
        run: |
          npx --yes supabase@latest start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit
          npx --yes supabase@latest status -o env > "$RUNNER_TEMP/supabase.env"

      - name: Start backend API
        working-directory: backend
        run: |
          set -euo pipefail
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$JWT_SECRET"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          pnpm build
          NODE_ENV=production PORT=3000 LOG_LEVEL=warn \
            SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" SUPABASE_JWT_SECRET="$JWT_SECRET" \
            PUBLIC_SITE_ORIGINS=http://localhost:3002 \
            nohup node dist/app/http-server.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 2
          done
          echo "::error::backend did not become healthy"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      # Playwright's webServer builds and starts the frontend on :3001.
      - name: Run E2E (shard ${{ matrix.shard }}/2)
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/2 --grep-invert @quarantine

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload traces and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Backend log on failure
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/backend.log" || true

  report:
    name: Merge E2E report
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
